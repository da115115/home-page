  <A NAME="fig:annexe:blocT">&#160;</A>Avec les notations de la figure <A HREF="node27.html#fig:annexe:blocT">A.1</A>, on obtient:
<P>
<P ALIGN="CENTER"><IMG WIDTH="451" HEIGHT="97"
 SRC="img23.gif"
 ALT="\begin{displaymath}
\left\{
\begin{array}
{lcr}
2R\cdot i_2+a-d & = & 0\ R\cdot...
 ...\ i_2 & = & \frac{Z}{R}\cdot\frac{e-a}{Z+Z_l}\end{array}\right.\end{displaymath}"></P>
<P>
D'o:
<P>
<P ALIGN="CENTER"><IMG WIDTH="184" HEIGHT="55"
 SRC="img24.gif"
 ALT="\begin{displaymath}
\left\{
\begin{array}
{lcl}
d & = & a+2Z\cdot\frac{e-a}{Z+Z_l}\ l & = & -Z_l\cdot\frac{e-a}{Z+Z_l}\end{array}\right.\end{displaymath}"></P>
<P>
Si <I>Z</I>=<I>Z</I><SUB><I>l</I></SUB>:
<P>
<P ALIGN="CENTER"><IMG WIDTH="103" HEIGHT="51"
 SRC="img25.gif"
 ALT="\begin{displaymath}
\left\{
\begin{array}
{lcl}
d & = & e\ l & = & \frac{a-e}{2}\end{array}\right.\end{displaymath}"></P>

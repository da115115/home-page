  <meta charset="utf-8">
  <title>Arkanoid (1986) — Denis Arnaud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .game-container {
      max-width: 680px;
      margin: 1.5rem auto;
      padding: 1.25rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    canvas {
      background: #000;
      border: 3px solid #64748b;
      border-radius: 6px;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      cursor: crosshair;
    }
    .controls-panel {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
      justify-content: center;
      width: 100%;
    }
    .btn {
      background: #0ea5e9;
      color: #fff;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn:hover { background: #38bdf8; transform: translateY(-1px); }
    .btn.secondary { background: #334155; color: #f8fafc; }
    .btn.secondary:hover { background: #475569; }
    .help-box {
      margin-top: 1rem;
      padding: 0.85rem 1.2rem;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 0.85rem;
      color: #94a3b8;
      width: 100%;
    }
    .help-box strong { color: #f8fafc; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header-row">
      <div>
        <h1 style="margin: 0; font-size: 1.5rem; color: #38bdf8; letter-spacing: 1px;">Arkanoid (1986)</h1>
        <p style="margin: 0.25rem 0 0 0; color: #94a3b8; font-size: 0.85rem;">Vaus & Energy Ball • Capsules Laser, Multi-ball & Élargissement (Taito)</p>
      </div>
    </div>

    <canvas id="arkanoidCanvas" width="480" height="560"></canvas>

    <div class="controls-panel">
      <button class="btn" onclick="togglePause()" id="pauseBtn">⏸ Pause</button>
      <button class="btn secondary" onclick="restartGame()">🔄 Nouvelle Partie</button>
      <a href="/misc/" class="btn secondary">🎮 Hub Jeux</a>
    </div>

    <div class="help-box">
      <strong>Contrôles :</strong>
      <span style="margin-left: 0.5rem;">[← / → ou Souris] Déplacer le vaisseau Vaus • [ESPACE / Clic gauche] Lancer la balle / Tirer aux lasers (capsule L)</span>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function initAudio() { if (!actx) actx = new AudioCtx(); }

    function playTone(freq, dur, type = 'square') {
      if (!actx) return;
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + dur);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    const canvas = document.getElementById('arkanoidCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // Game state
    let score = 0;
    let lives = 3;
    let paused = false;
    let gameOver = false;
    let victory = false;

    // Vaus Paddle
    const vaus = {
      x: W / 2,
      y: H - 40,
      baseW: 80,
      w: 80,
      h: 14,
      speed: 7,
      hasLaser: false,
      catchBall: false,
      expanded: false
    };

    // Balls
    let balls = [{ x: W / 2, y: H - 55, vx: 3.5, vy: -5, r: 6, stuck: true }];

    // Lasers
    let lasers = [];

    // Falling Capsules
    let capsules = [];
    const CAPSULE_TYPES = ['L', 'E', 'S', 'D', 'C'];
    const CAPSULE_COLORS = {
      'L': '#ef4444', // Laser (red)
      'E': '#3b82f6', // Expand (blue)
      'S': '#f97316', // Slow (orange)
      'D': '#10b981', // Disruption / 3 balls (cyan/green)
      'C': '#a855f7'  // Catch (purple)
    };

    // Bricks layout
    // 11 cols x 6 rows
    const COLS = 11;
    const ROWS = 6;
    const BRICK_W = 38;
    const BRICK_H = 16;
    const OFFSET_X = (W - (COLS * (BRICK_W + 4))) / 2;
    const OFFSET_Y = 60;

    const ROW_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#ec4899'];
    let bricks = [];

    function initBricks() {
      bricks = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          bricks.push({
            x: OFFSET_X + c * (BRICK_W + 4),
            y: OFFSET_Y + r * (BRICK_H + 4),
            w: BRICK_W,
            h: BRICK_H,
            color: ROW_COLORS[r % ROW_COLORS.length],
            points: (ROWS - r) * 20,
            active: true
          });
        }
      }
    }

    initBricks();

    // Input
    const keys = {};
    window.addEventListener('keydown', e => {
      initAudio();
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        launchOrFire();
      }
    });
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = ((e.clientX - rect.left) / rect.width) * W;
      vaus.x = Math.max(vaus.w / 2 + 10, Math.min(W - vaus.w / 2 - 10, mouseX));
    });

    canvas.addEventListener('click', () => {
      initAudio();
      launchOrFire();
    });

    function launchOrFire() {
      for (const b of balls) {
        if (b.stuck) {
          b.stuck = false;
          b.vx = (Math.random() - 0.5) * 4;
          b.vy = -5.5;
          playTone(400, 0.1);
        }
      }
      if (vaus.hasLaser) {
        lasers.push({ x: vaus.x - vaus.w * 0.35, y: vaus.y - 4, vy: -9 });
        lasers.push({ x: vaus.x + vaus.w * 0.35, y: vaus.y - 4, vy: -9 });
        playTone(700, 0.08, 'sawtooth');
      }
    }

    function togglePause() {
      paused = !paused;
      document.getElementById('pauseBtn').textContent = paused ? '▶ Reprendre' : '⏸ Pause';
    }

    function restartGame() {
      score = 0;
      lives = 3;
      paused = false;
      gameOver = false;
      victory = false;
      resetVaus();
      initBricks();
      capsules = [];
      lasers = [];
      document.getElementById('pauseBtn').textContent = '⏸ Pause';
    }

    function resetVaus() {
      vaus.w = vaus.baseW;
      vaus.hasLaser = false;
      vaus.catchBall = false;
      vaus.expanded = false;
      balls = [{ x: vaus.x, y: vaus.y - 15, vx: 0, vy: -5.5, r: 6, stuck: true }];
    }

    function update() {
      if (paused || gameOver || victory) return;

      // Keyboard movement
      if (keys['arrowleft'] || keys['q'] || keys['a']) {
        vaus.x = Math.max(vaus.w / 2 + 10, vaus.x - vaus.speed);
      }
      if (keys['arrowright'] || keys['d']) {
        vaus.x = Math.min(W - vaus.w / 2 - 10, vaus.x + vaus.speed);
      }

      // Lasers update
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.y += l.vy;
        let laserHit = false;
        for (const b of bricks) {
          if (b.active && l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
            b.active = false;
            laserHit = true;
            score += b.points;
            spawnCapsule(b.x + b.w / 2, b.y + b.h / 2);
            playTone(550, 0.06);
            break;
          }
        }
        if (laserHit || l.y < 0) lasers.splice(i, 1);
      }

      // Capsules update
      for (let i = capsules.length - 1; i >= 0; i--) {
        const c = capsules[i];
        c.y += 2.2;
        // Check catch by Vaus
        if (c.y + 8 >= vaus.y && c.y - 8 <= vaus.y + vaus.h &&
            c.x >= vaus.x - vaus.w / 2 && c.x <= vaus.x + vaus.w / 2) {
          applyPowerup(c.type);
          capsules.splice(i, 1);
          playTone(880, 0.15, 'sine');
          continue;
        }
        if (c.y > H) capsules.splice(i, 1);
      }

      // Balls update
      let activeBalls = 0;
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        if (b.stuck) {
          b.x = vaus.x;
          b.y = vaus.y - 12;
          activeBalls++;
          continue;
        }

        b.x += b.vx;
        b.y += b.vy;

        // Bounce left / right walls
        if (b.x - b.r < 8) { b.x = 8 + b.r; b.vx *= -1; playTone(300, 0.05); }
        if (b.x + b.r > W - 8) { b.x = W - 8 - b.r; b.vx *= -1; playTone(300, 0.05); }
        // Bounce top
        if (b.y - b.r < 10) { b.y = 10 + b.r; b.vy *= -1; playTone(300, 0.05); }

        // Bounce Vaus
        if (b.y + b.r >= vaus.y && b.y - b.r <= vaus.y + vaus.h &&
            b.x >= vaus.x - vaus.w / 2 - 4 && b.x <= vaus.x + vaus.w / 2 + 4) {
          if (vaus.catchBall) {
            b.stuck = true;
          } else {
            const hitOffset = (b.x - vaus.x) / (vaus.w / 2);
            const speed = Math.hypot(b.vx, b.vy);
            b.vx = hitOffset * (speed * 0.85);
            b.vy = -Math.sqrt(Math.max(4, speed * speed - b.vx * b.vx));
            b.y = vaus.y - b.r;
            playTone(450, 0.07);
          }
        }

        // Brick collisions
        for (const br of bricks) {
          if (!br.active) continue;
          if (b.x + b.r > br.x && b.x - b.r < br.x + br.w &&
              b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
            br.active = false;
            score += br.points;
            b.vy *= -1;
            spawnCapsule(br.x + br.w / 2, br.y + br.h / 2);
            playTone(550, 0.08);
            break;
          }
        }

        // Bottom pit
        if (b.y > H + 10) {
          balls.splice(i, 1);
        } else {
          activeBalls++;
        }
      }

      // Check ball lost
      if (activeBalls === 0) {
        lives--;
        playTone(180, 0.3, 'sawtooth');
        if (lives <= 0) {
          gameOver = true;
        } else {
          resetVaus();
        }
      }

      // Check win
      if (bricks.every(b => !b.active)) {
        victory = true;
        playTone(880, 0.4, 'triangle');
      }
    }

    function spawnCapsule(x, y) {
      if (Math.random() < 0.28) {
        const type = CAPSULE_TYPES[Math.floor(Math.random() * CAPSULE_TYPES.length)];
        capsules.push({ x, y, type });
      }
    }

    function applyPowerup(type) {
      score += 100;
      if (type === 'L') {
        vaus.hasLaser = true;
      } else if (type === 'E') {
        vaus.w = vaus.baseW * 1.5;
        vaus.expanded = true;
      } else if (type === 'S') {
        for (const b of balls) {
          b.vx *= 0.8;
          b.vy *= 0.8;
        }
      } else if (type === 'D') {
        if (balls.length > 0) {
          const main = balls[0];
          balls.push({ x: main.x, y: main.y, vx: main.vx - 2, vy: main.vy, r: 6, stuck: false });
          balls.push({ x: main.x, y: main.y, vx: main.vx + 2, vy: main.vy, r: 6, stuck: false });
        }
      } else if (type === 'C') {
        vaus.catchBall = true;
      }
    }

    function render() {
      // Space background with stars
      ctx.fillStyle = '#050814';
      ctx.fillRect(0, 0, W, H);

      // Frame borders
      ctx.fillStyle = '#475569';
      ctx.fillRect(0, 0, 8, H);
      ctx.fillRect(W - 8, 0, 8, H);
      ctx.fillRect(0, 0, W, 8);

      // Top Score Bar
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px monospace';
      ctx.fillText('SCORE : ' + score, 20, 30);
      ctx.fillText('VIES : ', W - 140, 30);
      for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(W - 80 + i * 22, 20, 16, 8);
      }

      // Draw Bricks
      for (const b of bricks) {
        if (!b.active) continue;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        // 3D Brick bevel
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(b.x, b.y, b.w, 2);
        ctx.fillRect(b.x, b.y, 2, b.h);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2);
        ctx.fillRect(b.x + b.w - 2, b.y, 2, b.h);
      }

      // Draw Lasers
      ctx.fillStyle = '#ef4444';
      for (const l of lasers) {
        ctx.fillRect(l.x - 2, l.y, 4, 10);
      }

      // Draw Capsules
      for (const c of capsules) {
        ctx.fillStyle = CAPSULE_COLORS[c.type] || '#fff';
        ctx.beginPath();
        ctx.roundRect(c.x - 14, c.y - 7, 28, 14, 7);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(c.type, c.x, c.y + 3);
        ctx.textAlign = 'start';
      }

      // Draw Vaus Paddle
      const vx = vaus.x - vaus.w / 2;
      const vy = vaus.y;
      // Vaus metallic gradient
      ctx.fillStyle = vaus.hasLaser ? '#dc2626' : '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(vx, vy, vaus.w, vaus.h, 6);
      ctx.fill();
      // Center stripe
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(vaus.x - 12, vy + 3, 24, vaus.h - 6);

      // Draw Balls
      ctx.fillStyle = '#f8fafc';
      for (const b of balls) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Overlays
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '15px monospace';
        ctx.fillText('Cliquez sur Nouvelle Partie pour rejouer', W / 2, H / 2 + 25);
        ctx.textAlign = 'start';
      } else if (victory) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('VICTOIRE !', W / 2, H / 2 - 10);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '15px monospace';
        ctx.fillText(`Score : ${score} pts • Bravo commandant Vaus`, W / 2, H / 2 + 25);
        ctx.textAlign = 'start';
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>

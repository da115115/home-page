<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="8" />

  <!-- Dynamic Recall Loop -->
  <!-- Arc from angle approx 50 deg to 310 deg -->
  <path d="M 330 395 A 160 160 0 1 1 390 200"
        fill="none"
        stroke="url(#arcGrad)"
        stroke-width="40"
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Arrowhead pointing forward into the loop -->
  <polygon points="380,140 435,215 345,215"
           fill="#818cf8"
           transform="rotate(22 390 190)" />

  <!-- Center Core Node (Memory / Recall / Data) -->
  <circle cx="256" cy="256" r="46" fill="#38bdf8" opacity="0.9" filter="url(#glow)" />
  <circle cx="256" cy="256" r="22" fill="#ffffff" />
</svg>
